name: Engine Cross-Check

# 引擎一致性闸门:构建平台无关的 :legado-engine 与 :server(JVM,无需 Android SDK),
# 并在 Phase 3 起运行书源 parity 测试(三端 search/toc/content 规范化 hash 一致)。
# Phase 0 仅为构建骨架 + parity 占位步骤。
on:
  push:
    branches:
      - main
      - monorepo/unify
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-jvm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-engine-${{ hashFiles('**/gradle-wrapper.properties', '**/build.gradle', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-engine-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build legado-engine + server (JVM)
        # M0 起 :modules:server 已纳入 root Gradle(Kotlin 2.3/Java 17/Spring 2.7.18/
        # Vert.x 4),纯 JVM 无需 Android SDK,在此提供 JVM 编译反馈(比 docker 快)。
        # M0 阶段 server 仍用自带旧引擎快照(不依赖 :legado-engine);M1 加 project 依赖后
        # server 构建会一起校验引擎。若 server 配置/Vert.x 迁移有问题,此步即红。
        # engine 用 build(含 parity test);server 用 assemble(不含 test——server 的 JUnit4
        # 空 SpringBootTest 需 vintage+完整 context,非 M0 目标,端到端由 Docker smoke 验)。
        run: ./gradlew :modules:legado-engine:build :modules:server:assemble --no-daemon --stacktrace

      - name: Enforce engine import boundary
        # 引擎禁止 import android.*/androidx.*/com.script.*/com.htmake.*
        # 锚定 ^import:真实 import 语句总在行首(Kotlin 顶层 import 无缩进),
        # 避免匹配注释/字符串中提及的 "import com.script.*" 等文档文本(误报)。
        run: |
          set -e
          echo "Checking :legado-engine has no forbidden imports..."
          ! grep -rnE "^import (android|androidx|com\.script|com\.htmake)\." modules/legado-engine/src/main/kotlin || \
            { echo "ERROR: :legado-engine contains forbidden imports (android/androidx/com.script/com.htmake)"; exit 1; }
          echo "OK: :legado-engine import boundary clean."

      - name: Parity test (skeleton)
        # §5c parity 已起步:BookSourceParityTest(合成 JSoup/JsonPath fixture,引擎侧
        # 规范化 hash 契约)经上面的 `:modules:legado-engine:build` 的 `test` 任务执行。
        # 本步仅占位打印;三端 hash 一致性(app/server 复跑同一 fixture)待 Phase 3。
        run: |
          echo "::notice::BookSourceParityTest runs via ./gradlew :modules:legado-engine:build (test task). Cross-platform hash parity = Phase 3."