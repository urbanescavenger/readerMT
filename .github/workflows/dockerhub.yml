name: Build Docker Image (DockerHub)

# 从 reader-mt 移植,适配 monorepo(Dockerfile 在 modules/server/)。
# 需要 secrets: DOCKER_USERNAME / DOCKER_PASSWORD。
#
# 触发与 tag 规则(与 GHCR 的 docker.yml 对齐):
# - 推 monorepo/unify → 发布 urbanescavenger/reader:unify(滚动 tag,每次推送覆盖)
# - 打 v* tag        → 发布 :latest + :vX.Y.Z(正式版;latest 只跟随 tag,不跟分支)
# - 手动 dispatch
#
# 背景:此前只在 v* 时构建,导致分支上的开发成果永远不会出现在 DockerHub
# (用户部署侧"拉不到新版"),故补上分支触发。
on:
  push:
    branches:
      - monorepo/unify
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: urbanescavenger/reader
          tags: |
            type=raw,value=unify,enable=${{ github.ref == 'refs/heads/monorepo/unify' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          # M0 起 server 纳入 root Gradle,构建需仓库根的 settings.gradle/catalog
          context: .
          file: ./modules/server/Dockerfile.source
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: |
            linux/amd64
            linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max