name: Build Docker Image

# 构建服务器(modules/server/Dockerfile.source,纳入 root Gradle)并推 GHCR 供下载验证。
# monorepo/unify 分支推 :unify(每次 push 验证构建+smoke);tag v* 推 :latest+:<tag>(注意 v* 也会触发 android-build 发布)。
on:
  push:
    branches: [monorepo/unify]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/urbanescavenger/readermt
          tags: |
            type=raw,value=unify,enable=${{ github.ref == 'refs/heads/monorepo/unify' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # M0 起 server 纳入 root Gradle,构建需仓库根的 settings.gradle/catalog
          context: .
          file: ./modules/server/Dockerfile.source
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run server + curl smoke (§5b)
        # 服务器必须真正起来才算绿(去掉 continue-on-error,启动失败即红)。
        # M1 前曾因 continue-on-error+curl||true 掩盖了启动失败(假绿)。
        run: |
          set -x
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name reader -p 8080:8080 -e SPRING_PROFILES_ACTIVE=prod "$IMG"
          UP=""
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ >/dev/null 2>&1; then UP="yes"; echo "server up after ${i}x2s"; break; fi
            sleep 2
          done
          if [ -z "$UP" ]; then
            echo "ERROR: server did not come up within 120s"
            exit 1
          fi
          echo "--- GET / ---"
          curl -sS http://localhost:8080/ | head -c 300 || true
          echo
          echo "--- POST /reader3/searchBook (M2 引擎冒烟铁证) ---"
          # 用「未来天王」纯 HTTP 书源跑真实搜索,断言 isSuccess 且 data 非空。
          # 这证明服务器端消费统一 :legado-engine 真实可用(不再是假绿)。
          if ! command -v jq >/dev/null 2>&1; then
            echo "ERROR: jq not available in runner"
            exit 1
          fi
          RESP=$(curl -sS -X POST http://localhost:8080/reader3/searchBook \
            -H "Content-Type: application/json" \
            --data-binary @.github/smoke/searchBook-request.json)
          echo "$RESP" | head -c 1000
          echo
          if ! echo "$RESP" | jq -e '.isSuccess == true' >/dev/null 2>&1; then
            echo "ERROR: searchBook isSuccess != true"
            echo "--- docker logs (tail) ---"
            docker logs reader 2>&1 | tail -40 || true
            exit 1
          fi
          COUNT=$(echo "$RESP" | jq '[.data[]?] | length')
          echo "searchBook result count: $COUNT"
          if [ -z "$COUNT" ] || [ "$COUNT" = "0" ]; then
            echo "ERROR: searchBook returned 0 results (data empty)"
            echo "--- docker logs (tail) ---"
            docker logs reader 2>&1 | tail -40 || true
            exit 1
          fi
          echo "M2 smoke OK: server consumed :legado-engine and searched real books"
          echo "--- docker logs (tail) ---"
          docker logs reader 2>&1 | tail -20 || true

      - name: browserless renderHtmlWithJs smoke (§9.9)
        # 直接对 browserless /function 跑 RENDER_HTML_WITH_JS_CODE(从 Kotlin 源码提取,零重复),
        # 验证 renderHtmlWithJs 的 Puppeteer 逻辑(setContent+eval / window.result 注入 / sourceRegex 命中)。
        # 自包含、确定性、不依赖活站;browserless 镜像较大,拉取/启动不稳时再按 continue-on-error 提示。
        run: |
          set -x
          docker run -d --name browserless -p 3000:3000 ghcr.io/browserless/chromium:latest
          READY=""
          for i in $(seq 1 90); do
            # browserless v2 对 / 返回 404,用其代理的 CDP 端点 /json/version 判就绪
            if curl -sf http://localhost:3000/json/version >/dev/null 2>&1; then READY="yes"; echo "browserless up after ${i}x2s"; break; fi
            sleep 2
          done
          if [ -z "$READY" ]; then
            echo "ERROR: browserless did not come up"
            docker logs browserless 2>&1 | tail -20 || true
            exit 1
          fi
          # 从 Kotlin 源码提取 RENDER_HTML_WITH_JS_CODE(避免与实现重复)。
          # 收尾行 `}"""` 同时含函数收尾 `}` 与 raw string 结束符,须保留 `}` 剥掉 `"""`。
          # 注意 code 必须是无尾分号的函数表达式(browserless 包成 `(${code})({page,...})`,尾分号 → 语法错误)。
          CODE=$(awk '/RENDER_HTML_WITH_JS_CODE = """/{f=1; sub(/.*RENDER_HTML_WITH_JS_CODE = """/,""); print; next} f && /^}"""/{sub(/"""/,""); print; f=0; next} f{print}' modules/server/src/main/java/io/legado/app/help/WebViewRenderHelp.kt)
          # 失败时 dump browserless 容器日志(FunctionRunner 的 console.error 会打印真实 page.evaluate 错误)
          fail() { echo "ERROR: $1"; echo "--- docker logs browserless (tail) ---"; docker logs browserless 2>&1 | tail -40 || true; exit 1; }
          # 用例1:setContent + eval JS(纯 DOM 提取)
          R1=$(jq -n --arg code "$CODE" '{code:$code, context:{url:null, html:"<h1>书名A</h1>", javaScript:"document.querySelector(\"h1\").innerText", ua:null, sourceRegex:null, overrideUrlRegex:null, delayTime:0, result:null, headers:null}}' \
            | curl -sS -X POST http://localhost:3000/function -H "Content-Type: application/json" --data-binary @-)
          echo "case1: $R1"
          if ! echo "$R1" | jq -e '.result == "书名A"' >/dev/null 2>&1; then fail "case1 failed"; fi
          # 用例2:window.result 注入(镜像 getWebJsResult 的 result 参数)
          R2=$(jq -n --arg code "$CODE" '{code:$code, context:{url:null, html:"<h1>书名A</h1>", javaScript:"JSON.stringify(window.result) + \"|\" + document.querySelector(\"h1\").innerText", ua:null, sourceRegex:null, overrideUrlRegex:null, delayTime:0, result:"{\"book\":123}", headers:null}}' \
            | curl -sS -X POST http://localhost:3000/function -H "Content-Type: application/json" --data-binary @-)
          echo "case2: $R2"
          if ! echo "$R2" | jq -e '.result == "{\"book\":123}|书名A"' >/dev/null 2>&1; then fail "case2 failed"; fi
          # 用例3:sourceRegex 命中请求URL(镜像 webViewGetSource 拦截)
          R3=$(jq -n --arg code "$CODE" '{code:$code, context:{url:null, html:"<img src=\"https://example.com/cover.jpg\">", javaScript:"\"should-not-reach\"", ua:null, sourceRegex:"example\\.com", overrideUrlRegex:null, delayTime:0, result:null, headers:null}}' \
            | curl -sS -X POST http://localhost:3000/function -H "Content-Type: application/json" --data-binary @-)
          echo "case3: $R3"
          if ! echo "$R3" | jq -e '.result == "https://example.com/cover.jpg"' >/dev/null 2>&1; then fail "case3 failed"; fi
          echo "browserless renderHtmlWithJs smoke OK"