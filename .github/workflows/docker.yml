name: Build Docker Image

# Phase 2: build the server (reader-mt, own toolchain: gradle7/JDK8/cli.gradle)
# from modules/server/Dockerfile.source. Build = verify the server compiles+
# packages; run+curl = verify it serves (§5b). Push to GHCR only on tags.
on:
  push:
    branches: [main, monorepo/unify]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image (verify compile + package)
        uses: docker/build-push-action@v6
        with:
          context: ./modules/server
          file: ./modules/server/Dockerfile.source
          push: false
          load: true
          tags: reader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run server + curl smoke (§5b)
        continue-on-error: true
        run: |
          set -x
          docker run -d --name reader -p 8080:8080 -e SPRING_PROFILES_ACTIVE=prod reader:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ >/dev/null 2>&1; then echo "server up after ${i}x2s"; break; fi
            sleep 2
          done
          echo "--- GET / ---"
          curl -sS http://localhost:8080/ | head -c 300 || true
          echo
          echo "--- docker logs (tail) ---"
          docker logs reader 2>&1 | tail -40 || true

      - name: Login to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: ./modules/server
          file: ./modules/server/Dockerfile.source
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max