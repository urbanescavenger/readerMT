name: Build Docker Image

# 构建服务器(modules/server/Dockerfile.source,纳入 root Gradle)并推 GHCR 供下载验证。
# monorepo/unify 分支推 :unify(每次 push 验证构建+smoke);tag v* 推 :latest+:<tag>(注意 v* 也会触发 android-build 发布)。
on:
  push:
    branches: [monorepo/unify]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/urbanescavenger/readermt
          tags: |
            type=raw,value=unify,enable=${{ github.ref == 'refs/heads/monorepo/unify' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # M0 起 server 纳入 root Gradle,构建需仓库根的 settings.gradle/catalog
          context: .
          file: ./modules/server/Dockerfile.source
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run server + curl smoke (§5b)
        # 服务器必须真正起来才算绿(去掉 continue-on-error,启动失败即红)。
        # M1 前曾因 continue-on-error+curl||true 掩盖了启动失败(假绿)。
        run: |
          set -x
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name reader -p 8080:8080 -e SPRING_PROFILES_ACTIVE=prod "$IMG"
          UP=""
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ >/dev/null 2>&1; then UP="yes"; echo "server up after ${i}x2s"; break; fi
            sleep 2
          done
          if [ -z "$UP" ]; then
            echo "ERROR: server did not come up within 120s"
            exit 1
          fi
          echo "--- GET / ---"
          curl -sS http://localhost:8080/ | head -c 300 || true
          echo
          echo "--- POST /reader3/searchBook (M2 引擎冒烟铁证) ---"
          # 用「未来天王」纯 HTTP 书源跑真实搜索,断言 isSuccess 且 data 非空。
          # 这证明服务器端消费统一 :legado-engine 真实可用(不再是假绿)。
          if ! command -v jq >/dev/null 2>&1; then
            echo "ERROR: jq not available in runner"
            exit 1
          fi
          RESP=$(curl -sS -X POST http://localhost:8080/reader3/searchBook \
            -H "Content-Type: application/json" \
            --data-binary @.github/smoke/searchBook-request.json)
          echo "$RESP" | head -c 1000
          echo
          if ! echo "$RESP" | jq -e '.isSuccess == true' >/dev/null 2>&1; then
            echo "ERROR: searchBook isSuccess != true"
            echo "--- docker logs (tail) ---"
            docker logs reader 2>&1 | tail -40 || true
            exit 1
          fi
          COUNT=$(echo "$RESP" | jq '[.data[]?] | length')
          echo "searchBook result count: $COUNT"
          if [ -z "$COUNT" ] || [ "$COUNT" = "0" ]; then
            echo "ERROR: searchBook returned 0 results (data empty)"
            echo "--- docker logs (tail) ---"
            docker logs reader 2>&1 | tail -40 || true
            exit 1
          fi
          echo "M2 smoke OK: server consumed :legado-engine and searched real books"
          echo "--- docker logs (tail) ---"
          docker logs reader 2>&1 | tail -20 || true

      - name: Sync endpoints behavior smoke (阶段1 双端同步)
        # 阶段 1 的 syncPush / getTombstones 行为验证。编译绿只证明"能编译",
        # 这里的断言覆盖几处"错一点就静默丢数据"的地方:
        #   客户端版本号必须原样保留(被刷成 now 会让 LWW 退化成"服务端永远赢")、
        #   LWW 拒绝旧版本且不覆盖内容、相等时间戳被接受(两端收敛的前提)、
        #   删除写墓碑且墓碑可传播、书架白名单合并保留服务端进度、本地书被过滤、
        #   内置源被拒(回环防护)、滞后实体不能复活已删除的书。
        # prod profile 下 secure=false,无需登录。
        run: |
          set -e
          BASE=http://localhost:8080/reader3
          T1=1700000000000
          fail() {
            echo "ERROR: $1"
            echo "--- docker logs reader (tail) ---"
            docker logs reader 2>&1 | tail -40 || true
            exit 1
          }
          post() { curl -sS -X POST "$1" -H "Content-Type: application/json" --data-binary "$2"; }
          # 取某本书的 JSON(--arg 传 key,避免在 jq 程序里做 shell 转义)。
          # 注意:这是"跑 jq 的过滤器",必须在管道里用(echo "$R" | book_json URL);
          # 不要用 $(book_json URL) 当"jq 程序文本"—— 那样命令替换会拿到空串。
          book_json() { jq -c --arg k "$1" '[.data[]|select(.bookUrl==$k)][0]'; }

          echo "--- 1) 推送两个书源(带客户端版本号) ---"
          R=$(post "$BASE/syncPush" "$(jq -n --argjson t $T1 '{bookSources:[
                {bookSourceUrl:"https://a.example", bookSourceName:"A", lastModifiedAt:$t},
                {bookSourceUrl:"https://b.example", bookSourceName:"B", lastModifiedAt:$t}]}')")
          echo "$R"
          echo "$R" | jq -e '.isSuccess == true and .data.bookSources.applied == 2' >/dev/null \
            || fail "syncPush should apply 2 book sources"

          echo "--- 2) 客户端版本号必须原样保留,不能被刷成 now ---"
          R=$(curl -sS "$BASE/getBookSources")
          echo "$R"
          echo "$R" | jq -e --argjson t $T1 \
            '[.data[]|select(.bookSourceUrl=="https://a.example")][0].lastModifiedAt == $t' >/dev/null \
            || fail "pushed lastModifiedAt was not preserved"

          echo "--- 3) LWW:更旧的版本被拒,且不覆盖内容 ---"
          R=$(post "$BASE/syncPush" "$(jq -n --argjson t $((T1-1000)) \
            '{bookSources:[{bookSourceUrl:"https://a.example", bookSourceName:"A-STALE", lastModifiedAt:$t}]}')")
          echo "$R"
          echo "$R" | jq -e '.data.bookSources.skipped == 1 and .data.bookSources.applied == 0' >/dev/null \
            || fail "stale push should be skipped"
          R=$(curl -sS "$BASE/getBookSources")
          echo "$R" | jq -e '[.data[]|select(.bookSourceUrl=="https://a.example")][0].bookSourceName == "A"' >/dev/null \
            || fail "stale push overwrote a newer copy"

          echo "--- 4) 相等时间戳必须被接受(两端收敛的前提) ---"
          R=$(post "$BASE/syncPush" "$(jq -n --argjson t $T1 \
            '{bookSources:[{bookSourceUrl:"https://a.example", bookSourceName:"A-EQ", lastModifiedAt:$t}]}')")
          echo "$R"
          echo "$R" | jq -e '.data.bookSources.applied == 1' >/dev/null \
            || fail "equal-timestamp push should be applied"

          echo "--- 5) 回环防护:readerServer:// 内置源必须被拒 ---"
          R=$(post "$BASE/syncPush" "$(jq -n --argjson t $((T1+99999)) \
            '{bookSources:[{bookSourceUrl:"readerServer://host/user", bookSourceName:"builtin", lastModifiedAt:$t}]}')")
          echo "$R"
          echo "$R" | jq -e '.data.bookSources.skipped == 1 and .data.bookSources.applied == 0' >/dev/null \
            || fail "built-in readerServer:// source must be rejected"

          echo "--- 6) 删除书源写墓碑 ---"
          post "$BASE/deleteBookSource" '{"bookSourceUrl":"https://b.example"}' >/dev/null
          R=$(curl -sS "$BASE/getTombstones")
          echo "$R"
          echo "$R" | jq -e '[.data[]|select(.type=="bookSource" and .key=="https://b.example")]|length == 1' >/dev/null \
            || fail "deleteBookSource should write a bookSource tombstone"

          echo "--- 7) 书架:新书整对象入库(带上服务端侧字段) ---"
          R=$(post "$BASE/syncPush" "$(jq -n --argjson t $T1 '{books:[{
                bookUrl:"https://a.example/book/1", name:"B1", author:"AU1", origin:"https://a.example",
                lastModifiedAt:$t, totalChapterNum:7, durChapterIndex:3}]}')")
          echo "$R"
          echo "$R" | jq -e '.data.books.applied == 1' >/dev/null || fail "book push should be applied"

          echo "--- 8) 书架:白名单合并必须保留服务端进度(不能整对象替换) ---"
          R=$(post "$BASE/syncPush" "$(jq -n --argjson t $((T1+1)) '{books:[{
                bookUrl:"https://a.example/book/1", name:"B1-renamed", author:"AU1",
                origin:"https://a.example", lastModifiedAt:$t}]}')")
          echo "$R"
          echo "$R" | jq -e '.data.books.applied == 1' >/dev/null || fail "newer book push should be applied"
          R=$(curl -sS "$BASE/getBookshelf")
          echo "$R"
          echo "$R" | jq -e --arg k "https://a.example/book/1" \
            '[.data[]|select(.bookUrl==$k)][0] | .name=="B1-renamed" and .totalChapterNum==7 and .durChapterIndex==3' >/dev/null \
            || fail "whitelist merge must preserve server-side progress; got $(echo "$R" | book_json https://a.example/book/1)"

          echo "--- 9) 本地书籍不参与同步 ---"
          R=$(post "$BASE/syncPush" "$(jq -n --argjson t $((T1+2)) '{books:[{
                bookUrl:"/storage/data/default/local_au/x.txt", name:"LOCAL", author:"AU2",
                origin:"loc_book", lastModifiedAt:$t}]}')")
          echo "$R"
          echo "$R" | jq -e '.data.books.skipped == 1 and .data.books.applied == 0' >/dev/null \
            || fail "local book must not be syncable"

          echo "--- 10) 删除书籍写墓碑 ---"
          post "$BASE/deleteBook" '{"bookUrl":"https://a.example/book/1"}' >/dev/null
          R=$(curl -sS "$BASE/getTombstones")
          echo "$R"
          echo "$R" | jq -e '[.data[]|select(.type=="book" and .key=="https://a.example/book/1")]|length == 1' >/dev/null \
            || fail "deleteBook should write a book tombstone"

          echo "--- 11) 墓碑经 syncPush 推入后实体被删(删除可传播) ---"
          post "$BASE/syncPush" "$(jq -n --argjson t $((T1+10)) '{books:[{
                bookUrl:"https://a.example/book/2", name:"B2", author:"AU3",
                origin:"https://a.example", lastModifiedAt:$t}]}')" >/dev/null
          R=$(post "$BASE/syncPush" "$(jq -n --argjson t $((T1+20)) \
            '{tombstones:[{type:"book", key:"https://a.example/book/2", deletedAt:$t}]}')")
          echo "$R"
          R=$(curl -sS "$BASE/getBookshelf")
          echo "$R"
          echo "$R" | jq -e '[.data[]|select(.bookUrl=="https://a.example/book/2")]|length == 0' >/dev/null \
            || fail "tombstone push should delete the entity"

          echo "--- 12) 墓碑之后重建的实体必须能存活 ---"
          post "$BASE/syncPush" "$(jq -n --argjson t $((T1+30)) '{books:[{
                bookUrl:"https://a.example/book/3", name:"B3", author:"AU4",
                origin:"https://a.example", lastModifiedAt:$t}]}')" >/dev/null
          post "$BASE/syncPush" "$(jq -n --argjson t $((T1+40)) \
            '{tombstones:[{type:"book", key:"https://a.example/book/3", deletedAt:$t}]}')" >/dev/null
          R=$(post "$BASE/syncPush" "$(jq -n --argjson t $((T1+50)) '{books:[{
                bookUrl:"https://a.example/book/3", name:"B3-recreated", author:"AU4",
                origin:"https://a.example", lastModifiedAt:$t}]}')")
          echo "$R"
          R=$(curl -sS "$BASE/getBookshelf")
          echo "$R"
          echo "$R" | jq -e --arg k "https://a.example/book/3" \
            '[.data[]|select(.bookUrl==$k)][0].name=="B3-recreated"' >/dev/null \
            || fail "entity newer than the tombstone must survive (re-created); got $(echo "$R" | book_json https://a.example/book/3)"

          echo "--- 13) 滞后实体不能复活已删除的书(墓碑比实体新) ---"
          post "$BASE/syncPush" "$(jq -n --argjson t $((T1+60)) '{books:[{
                bookUrl:"https://a.example/book/4", name:"B4", author:"AU5",
                origin:"https://a.example", lastModifiedAt:$t}]}')" >/dev/null
          post "$BASE/syncPush" "$(jq -n --argjson t $((T1+70)) \
            '{tombstones:[{type:"book", key:"https://a.example/book/4", deletedAt:$t}]}')" >/dev/null
          R=$(post "$BASE/syncPush" "$(jq -n --argjson t $((T1+65)) '{books:[{
                bookUrl:"https://a.example/book/4", name:"B4-stale", author:"AU5",
                origin:"https://a.example", lastModifiedAt:$t}]}')")
          echo "$R"
          echo "$R" | jq -e '.data.books.skipped == 1 and .data.books.applied == 0' >/dev/null \
            || fail "stale entity newer-than-tombstone check failed"
          R=$(curl -sS "$BASE/getBookshelf")
          echo "$R"
          echo "$R" | jq -e '[.data[]|select(.bookUrl=="https://a.example/book/4")]|length == 0' >/dev/null \
            || fail "stale push resurrected a deleted book"

          echo "--- 14) 书源字段必须忠实 round-trip(jsLib 等不能被丢) ---"
          # 服务端若用 SourceAnalyzer 解析推送来的书源,会丢掉 jsLib/enabledCookieJar/
          # variableComment/exploreScreen 等字段,第三台设备拉下来就是坏源(带 JS 库的直接失效)
          R=$(post "$BASE/syncPush" "$(jq -n --argjson t $((T1+80)) '{bookSources:[{
                bookSourceUrl:"https://rt.example", bookSourceName:"RT", lastModifiedAt:$t,
                jsLib:"function f(){return 1}", enabledCookieJar:true,
                variableComment:"vc", exploreScreen:"es"}]}')")
          echo "$R"
          echo "$R" | jq -e '.data.bookSources.applied == 1' >/dev/null || fail "round-trip source push should apply"
          R=$(curl -sS "$BASE/getBookSources")
          echo "$R"
          echo "$R" | jq -e '[.data[]|select(.bookSourceUrl=="https://rt.example")][0] | .jsLib=="function f(){return 1}" and .enabledCookieJar==true and .variableComment=="vc" and .exploreScreen=="es"' >/dev/null \
            || fail "book source fields must survive round-trip; got $(echo "$R" | jq -c '[.data[]|select(.bookSourceUrl=="https://rt.example")][0]')"

          echo "SYNC SMOKE OK: 双端同步端点行为全部符合预期"

      - name: browserless renderHtmlWithJs smoke (§9.9)
        # 直接对 browserless /function 跑 RENDER_HTML_WITH_JS_CODE(从 Kotlin 源码提取,零重复),
        # 验证 renderHtmlWithJs 的 Puppeteer 逻辑(setContent+eval / window.result 注入 / sourceRegex 命中)。
        # 自包含、确定性、不依赖活站;browserless 镜像较大,拉取/启动不稳时再按 continue-on-error 提示。
        run: |
          set -x
          docker run -d --name browserless -p 3000:3000 ghcr.io/browserless/chromium:latest
          READY=""
          for i in $(seq 1 90); do
            # browserless v2 对 / 返回 404,用其代理的 CDP 端点 /json/version 判就绪
            if curl -sf http://localhost:3000/json/version >/dev/null 2>&1; then READY="yes"; echo "browserless up after ${i}x2s"; break; fi
            sleep 2
          done
          if [ -z "$READY" ]; then
            echo "ERROR: browserless did not come up"
            docker logs browserless 2>&1 | tail -20 || true
            exit 1
          fi
          # 从 Kotlin 源码提取 RENDER_HTML_WITH_JS_CODE(避免与实现重复)。
          # 收尾行 `}"""` 同时含函数收尾 `}` 与 raw string 结束符,须保留 `}` 剥掉 `"""`。
          # 注意 code 必须是无尾分号的函数表达式(browserless 包成 `(${code})({page,...})`,尾分号 → 语法错误)。
          CODE=$(awk '/RENDER_HTML_WITH_JS_CODE = """/{f=1; sub(/.*RENDER_HTML_WITH_JS_CODE = """/,""); print; next} f && /^}"""/{sub(/"""/,""); print; f=0; next} f{print}' modules/server/src/main/java/io/legado/app/help/WebViewRenderHelp.kt)
          # 失败时 dump browserless 容器日志(FunctionRunner 的 console.error 会打印真实 page.evaluate 错误)
          fail() { echo "ERROR: $1"; echo "--- docker logs browserless (tail) ---"; docker logs browserless 2>&1 | tail -40 || true; exit 1; }
          # 用例1:setContent + eval JS(纯 DOM 提取)
          R1=$(jq -n --arg code "$CODE" '{code:$code, context:{url:null, html:"<h1>书名A</h1>", javaScript:"document.querySelector(\"h1\").innerText", ua:null, sourceRegex:null, overrideUrlRegex:null, delayTime:0, result:null, headers:null}}' \
            | curl -sS -X POST http://localhost:3000/function -H "Content-Type: application/json" --data-binary @-)
          echo "case1: $R1"
          if ! echo "$R1" | jq -e '.result == "书名A"' >/dev/null 2>&1; then fail "case1 failed"; fi
          # 用例2:window.result 注入(镜像 getWebJsResult 的 result 参数)
          R2=$(jq -n --arg code "$CODE" '{code:$code, context:{url:null, html:"<h1>书名A</h1>", javaScript:"JSON.stringify(window.result) + \"|\" + document.querySelector(\"h1\").innerText", ua:null, sourceRegex:null, overrideUrlRegex:null, delayTime:0, result:"{\"book\":123}", headers:null}}' \
            | curl -sS -X POST http://localhost:3000/function -H "Content-Type: application/json" --data-binary @-)
          echo "case2: $R2"
          if ! echo "$R2" | jq -e '.result == "{\"book\":123}|书名A"' >/dev/null 2>&1; then fail "case2 failed"; fi
          # 用例3:sourceRegex 命中请求URL(镜像 webViewGetSource 拦截)
          R3=$(jq -n --arg code "$CODE" '{code:$code, context:{url:null, html:"<img src=\"https://example.com/cover.jpg\">", javaScript:"\"should-not-reach\"", ua:null, sourceRegex:"example\\.com", overrideUrlRegex:null, delayTime:0, result:null, headers:null}}' \
            | curl -sS -X POST http://localhost:3000/function -H "Content-Type: application/json" --data-binary @-)
          echo "case3: $R3"
          if ! echo "$R3" | jq -e '.result == "https://example.com/cover.jpg"' >/dev/null 2>&1; then fail "case3 failed"; fi
          echo "browserless renderHtmlWithJs smoke OK"