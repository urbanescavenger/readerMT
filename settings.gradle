dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        //原仓库
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        maven {
            url = 'https://jitpack.io'
            content {
                includeGroupByRegex("com\\.github.*")
            }
        }
        mavenCentral()

        //镜像仓库,无法连接源仓库自行启用镜像仓库,不要提交修改
        //maven { url "https://maven-central-asia.storage-download.googleapis.com/maven2/" }
        //maven { url 'https://maven.aliyun.com/repository/google' }
        //maven { url 'https://maven.aliyun.com/repository/public' }
        //maven { url 'https://repo.huaweicloud.com/repository/maven/' }
    }
}
rootProject.name = 'legado'

// M0 起 :modules:server 已纳入 root Gradle(Kotlin 2.3.21/Java 17/Spring 3.3.5/Vert.x 4)。
// 原排除理由(旧工具链 Kotlin 1.5/Java 8 会被 monorepo 的 Kotlin 2.3/Java 17 压坏)随升级已失效。
// M0 阶段 server 尚不依赖 :legado-engine(旧快照自洽编译),M1 再加 project 依赖切引擎。
//
// SERVER_ONLY=true(Docker 构建 server 用):只 include :modules:server,跳过所有 Android 模块
// (:app/:modules:book/:modules:rhino)。因 gradle:9-jdk17 纯 JVM 镜像无 Android SDK,root Gradle
// 配置阶段 evaluate 这些模块会失败(compileSdk/schema location 缺失)。server 自身不依赖它们,
// maven 依赖解析走 settings.gradle 的 dependencyResolutionManagement,不受模块 include 影响。
if (System.getenv("SERVER_ONLY") == "true") {
    // M1 起 server 依赖 :modules:legado-engine(Docker 构建需一起 include,否则 project 依赖找不到)。
    include ':modules:legado-engine'
    include ':modules:server'
} else {
    include ':app'
    include ':modules:book'
    include ':modules:rhino'
    include ':modules:legado-engine'
    include ':modules:server'
}