        //maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        //maven { url 'https://repo.huaweicloud.com/repository/maven/' }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        //原仓库
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        maven {
            url = 'https://jitpack.io'
            content {
                includeGroupByRegex("com\\.github.*")
            }
        }
        mavenCentral()

        //镜像仓库,无法连接源仓库自行启用镜像仓库,不要提交修改
        //maven { url "https://maven-central-asia.storage-download.googleapis.com/maven2/" }
        //maven { url 'https://maven.aliyun.com/repository/google' }
        //maven { url 'https://maven.aliyun.com/repository/public' }
        //maven { url 'https://repo.huaweicloud.com/repository/maven/' }
    }
}
rootProject.name = 'legado'

include ':app'
include ':modules:book'
include ':modules:rhino'
include ':modules:legado-engine'
// :modules:server is NOT a root-Gradle subproject: it keeps its own toolchain
// (gradle 7 + JDK 8 + cli.gradle, Kotlin 1.5.21) and is built ONLY inside Docker
// (see modules/server/Dockerfile.source). Including it here would force the
// monorepo's Kotlin 2.3.21/Java 17 onto reader-mt's Kotlin 1.5/Java 8 code.