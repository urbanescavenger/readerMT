// :modules:legado-engine
// 平台无关的 legado 引擎模块(kotlin-jvm + java-library)。
// Phase 0: 空占位,确保模块可独立编译。
// Phase 1 将把 readerMT app/ 下的引擎源码(model/analyzeRule、data/entities DTO、
// help/http、utils、constant 等)剥离 Android 依赖后搬入此模块,
// 并通过 io.legado.app.platform.* SPI 注入平台实现。
// 引擎禁止 import android.*/androidx.*/com.script.*/com.htmake.*(由 CI grep 强制)。
plugins {
    alias libs.plugins.kotlin.jvm
}

kotlin {
    jvmToolchain(17)
}

// Phase 1 起填充:engine 共用依赖(两端都用)。
dependencies {
    implementation libs.gson
    implementation libs.okhttp
    implementation libs.jsoup
    implementation libs.jsoupxpath
    implementation libs.json.path
    implementation libs.hutool.core
    implementation libs.hutool.crypto
    implementation libs.commons.text
    implementation libs.kotlinx.coroutines.core
    implementation libs.quick.chinese.transfer.core
    implementation libs.mozilla.rhino
    // jackson-annotations:仅注解(BookSource 等实体 JSON 序列化时忽略 getSource 自引用)。
    // 引擎本身不做 Jackson 编解码(那是各平台的事),只依赖注解标注序列化行为,轻量纯注解。
    implementation libs.jackson.annotations
    // implementation libs.mozilla.rhino
    // implementation libs.kotlin.stdlib

    // §5c parity 测试 harness(JUnit 4;catalog 已有 junit:junit:4.13.2)。
    // testImplementation 自动继承 implementation,测试可见 gson/jsoup/jsoupxpath/
    // json-path/rhino/kotlinx-coroutines 等。`./gradlew :build` 的 `test` 任务执行。
    testImplementation libs.junit
}

// 打印测试失败详情(含 ComparisonFailure 的 expected/but was),
// 便于云端 CI 定位 hash 契约不匹配等断言失败。本地无 Gradle,CI 是唯一反馈环。
tasks.named('test') {
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}