// :modules:server —— reader-mt 服务端(root-Gradle 子项目,M1 引擎切换后)。
//
// M1 起服务器消费 :modules:legado-engine(kotlin-jvm,Java 17):删除自带的 50 个同名引擎
// 快照(src/main/java/io/legado/app 下),通过 `implementation project(':modules:legado-engine')`
// 用统一引擎,经 `com.htmake.reader.platform.*` 注入 Platform SPI。
//
// 关键:引擎 build.gradle 用 `implementation` 声明其依赖(okhttp/jsoup/gson/json-path/rhino 等),
// **不**向本模块暴露编译可见的传递依赖;server 保留文件(WebViewRenderHelp/BookHelp/
// JsoupExtensions/DebugLog/RssSource 等)仍直接 import okhttp3/org.jsoup/com.jayway.jsonpath/
// org.apache.commons.text,故须在此显式声明(用 catalog,版本与引擎一致,Gradle 同版本合并)。
plugins {
    alias libs.plugins.kotlin.jvm
    alias libs.plugins.kotlin.spring
    alias libs.plugins.spring.boot
    id 'java'
}

group = 'com.htmake'
version = '2.5.4'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    // ---- M1:统一 legado 引擎(删 50 同名快照后,服务器用引擎版)----
    implementation project(':modules:legado-engine')

    // Spring Boot 3.3.5(Gradle 9 兼容;javax→jakarta,服务器仅 ReaderApplication 1 处 PostConstruct)
    implementation libs.spring.boot.starter
    implementation libs.jakarta.annotation.api
    testImplementation libs.spring.boot.starter.test

    // Vert.x 4.5.x
    implementation libs.vertx.core
    implementation libs.vertx.lang.kotlin
    implementation libs.vertx.lang.kotlin.coroutines
    implementation libs.vertx.web
    implementation libs.vertx.web.client
    implementation libs.kotlinx.coroutines.core

    // json(对齐引擎版本:gson 2.13.2 / jackson 2.17.3 对齐 Spring BOM)
    implementation libs.gson
    implementation libs.jackson.module.kotlin

    // log
    implementation libs.kotlin.logging
    implementation libs.sysout.over.slf4j
    implementation libs.guava

    // 网络:server 保留文件直接引用 okhttp3 / okhttp logging-interceptor(对齐引擎 okhttp 5.3.2)
    implementation libs.okhttp
    implementation libs.logging.interceptor

    // 规则/HTML:server 保留文件直接引用 jsoup / json-path / commons-text(对齐引擎版本)
    implementation libs.jsoup
    implementation libs.jsoupxpath
    implementation libs.json.path
    implementation libs.commons.text

    // xml:epublib(server 独有 me.ag2s.epublib / org.kxml2)用 org.xmlpull;保留本地 jar
    implementation fileTree(dir: 'src/lib', include: ['xmlpull-*.jar'])
}

// 服务端打包:bootJar(Docker 用 ./gradlew :modules:server:bootJar)
bootJar {
    archiveFileName = 'reader.jar'
    mainClass = 'com.htmake.reader.ReaderApplicationKt'
}

tasks.named('test') {
    useJUnitPlatform()
}
